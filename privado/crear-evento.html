<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Evento - Admin</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css"> <!-- Reutilizamos tu CSS del login para el formulario -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

    <header class="header blur-header" id="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">🎺 Banda (Panel Admin)</a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li><a href="eventos.html" class="nav__link">Volver a Eventos</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="section login">
            <div class="container login__container">
                
                <!-- El formulario enviará los datos a la nueva ruta /api/crear-evento -->
                <form action="/api/crear-evento" method="POST" class="login__form">
                    <div class="login__icon">
                        <i class="ri-calendar-todo-line"></i>
                    </div>
                    <h2 class="login__title">Nuevo Evento</h2>
                    <p class="login__description">Publica un ensayo o actuación para la agrupación.</p>

                    <div class="login__inputs">
                        <div class="login__box">
                            <label for="titulo" class="login__label">Título del Evento</label>
                            <input type="text" id="titulo" name="titulo" required class="login__input" placeholder="Ej: Ensayo General">
                        </div>
                        
                        <div class="login__box">
                            <label for="fecha_hora" class="login__label">Fecha y Hora</label>
                            <input type="datetime-local" id="fecha_hora" name="fecha_hora" required class="login__input">
                        </div>

                        <div class="login__box">
                            <label for="tipo_evento" class="login__label">Tipo de Evento</label>
                            <select id="tipo_evento" name="tipo_evento" required class="login__input" style="cursor: pointer;">
                                <option value="Ensayo">Ensayo</option>
                                <option value="Actuacion">Actuación</option>
                            </select>
                        </div>

                        <div class="login__box">
                            <label for="lugar" class="login__label">Lugar</label>
                            <input type="text" id="lugar" name="lugar" required class="login__input" placeholder="Ej: Local de ensayo">
                        </div>
                    </div>

                    <button type="submit" class="login__button">Publicar Evento</button>
                </form>

            </div>
        </section>
    </main>

</body>
</html>
